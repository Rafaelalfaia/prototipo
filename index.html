iv></div>`,`<button class="ghost" data-close>Fechar</button><button class="secondary" data-action="prescribe">Prescrever exercícios</button><button class="primary" data-action="new-evolution">Registrar evolução</button>`)}function simpleForm(title,fields,success){openModal(title,`<div class="form-grid">${fields}</div>`,`<button class="ghost" data-close>Cancelar</button><button class="primary" data-action="generic-save" data-success="${success}">Salvar</button>`)}
    const toastEl=document.getElementById('toast');document.addEventListener('click',e=>{const role=e.target.closest('[data-role]');if(role){currentRole=role.dataset.role;activeNav=0;completedExercises=1;render();return}const nav=e.target.closest('[data-nav]');if(nav){activeNav=Number(nav.dataset.nav);render();return}if(e.target.closest('[data-close]')){closeModal();return}const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;if(a==='triage')triageModal(el.dataset.name);else if(a==='record')recordModal(el.dataset.name);else if(a==='new-evolution')simpleForm('Registrar evolução',`<div class="field"><label>Paciente</label><select><option>Marina Costa</option><option>Rafael Souza</option></select></div><div class="field"><label>Nível de dor</label><input type="number" min="0" max="10" value="2"></div><div class="field full-span"><label>Evolução da sessão</label><textarea placeholder="Procedimentos, resposta e próximos passos..."></textarea></div>`,'Evolução registrada com sucesso');else if(a==='new-patient')simpleForm('Cadastrar paciente',`<div class="field"><label>Nome completo</label><input placeholder="Nome do paciente"></div><div class="field"><label>CPF</label><input placeholder="000.000.000-00"></div><div class="field"><label>Telefone</label><input placeholder="(00) 00000-0000"></div><div class="field"><label>Data de nascimento</label><input type="date"></div>`,'Paciente cadastrado com sucesso');else if(a==='new-access')simpleForm('Criar acesso',`<div class="field"><label>Nome</label><input placeholder="Nome do profissional"></div><div class="field"><label>Perfil</label><select><option>Fisioterapeuta</option><option>Recepção</option><option>Administrador</option></select></div><div class="field full-span"><label>E-mail</label><input type="email" placeholder="nome@clinica.com"></div>`,'Acesso criado e convite enviado');else if(a==='send-note')simpleForm('Mensagem para Ana',`<div class="field full-span"><label>Como você se sentiu?</label><textarea placeholder="Conte como foi realizar os exercícios..."></textarea></div>`,'Mensagem enviada para Ana');else if(a==='exercise'){el.classList.toggle('checked');completedExercises+=el.classList.contains('checked')?1:-1;exerciseCount.textContent=`${completedExercises} de 3 feitos`;if(completedExercises===3)toast('Parabéns! Exercícios de hoje concluídos')}else if(a==='save-triage'){closeModal();toast('Triagem salva e fisioterapeuta avisada');render()}else if(a==='generic-save'){closeModal();toast(el.dataset.success)}else if(a==='checkin'){el.closest('.row-actions').innerHTML='<span class="pill wait">Triagem pendente</span><button class="primary small" data-action="triage" data-name="Lucas Barros">Fazer triagem</button>';toast('Chegada confirmada')}else if(a==='pay')openModal('Pagamento seguro',`<div class="note-box"><b>Mensalidade · outubro</b><p>Total de R$ 280,00. Escolha uma forma de pagamento para continuar.</p></div><div class="form-grid" style="margin-top:15px"><button class="quick" data-action="finish-payment"><b>PIX</b><span>Confirmação imediata</span></button><button class="quick" data-action="finish-payment"><b>Cartão</b><span>Crédito ou débito</span></button></div>`,'<button class="ghost" data-close>Cancelar</button>');else if(a==='finish-payment'){closeModal();toast('Pagamento confirmado com sucesso')}else if(a==='photo')toast('Câmera aberta para registrar sua evolução');else if(a==='upload-video')toast('Envio de vídeo iniciado');else if(a==='notifications')toast('Você não tem novas notificações');else if(a==='play-video')toast('Reprodução do tutorial iniciada');else if(a==='appointment-details')openModal('Próxima sessão','<div class="note-box"><b>Terça, 29 de setembro · 09:00</b><p>Atendimento com Ana Lima. Chegue 10 minutos antes para a triagem.</p></div>','<button class="primary" data-close>Entendi</button>');else if(a==='side-note'){activeNav=1;render()}else toast('Ação demonstrada no protótipo')});modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
    (function registerWebMCP(){
      const context=document.modelContext;if(!context?.registerTool)return;const lifecycle=new AbortController();
      const report=error=>console.warn('WebMCP',error);
      try{void Promise.resolve(context.registerTool({name:'view_role_dashboard',title:'Visualizar perfil do protótipo',description:'Abre o painel visível de administrador, recepção, fisioterapeuta ou paciente.',inputSchema:{type:'object',properties:{role:{type:'string',enum:['admin','reception','physio','patient']}},required:['role'],additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute(input){if(!input||!profiles[input.role])throw new Error('Perfil inválido.');currentRole=input.role;activeNav=0;render();return{role:input.role,status:'visible'}}},{signal:lifecycle.signal})).catch(report)}catch(error){report(error)}
      try{void Promise.resolve(context.registerTool({name:'mark_patient_exercise',title:'Marcar exercício do paciente',description:'Marca ou desmarca um dos três exercícios visíveis no plano diário do paciente.',inputSchema:{type:'object',properties:{exerciseNumber:{type:'integer',minimum:1,maximum:3},completed:{type:'boolean'}},required:['exerciseNumber','completed'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!input||!Number.isInteger(input.exerciseNumber)||input.exerciseNumber<1||input.exerciseNumber>3||typeof input.completed!=='boolean')throw new Error('Dados do exercício inválidos.');if(currentRole!=='patient'){currentRole='patient';activeNav=0;completedExercises=1;render()}const buttons=[...document.querySelectorAll('[data-action="exercise"]')],button=buttons[input.exerciseNumber-1],isDone=button.classList.contains('checked');if(isDone!==input.completed)button.click();return{exerciseNumber:input.exerciseNumber,completed:input.completed,totalCompleted:completedExercises}}},{signal:lifecycle.signal})).catch(report)}catch(error){report(error)}
    })();
